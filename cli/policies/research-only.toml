# Gemini CLI non-interactive research policy.
# Keep this file in sync with cli/src/gemini-client.mjs.

[[rule]]
toolName = "google_web_search"
decision = "allow"
priority = 999
interactive = false

[[rule]]
toolName = "*"
decision = "deny"
priority = 998
interactive = false
denyMessage = "This runner permits Google web search only."
